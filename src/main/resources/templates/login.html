<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center py-4">
                    <h3 class="mb-0">
                        <i class="fas fa-lock"></i> Please sign in
                    </h3>
                </div>
                <div class="card-body p-5">

                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        <i class="fas fa-exclamation-circle"></i>
                        <strong>Error:</strong> Usuario o contraseña incorrectos
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show">
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        <i class="fas fa-check-circle"></i>
                        Has cerrado sesión exitosamente
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Username
                            </label>
                            <input type="text" id="username" name="username"
                                   class="form-control form-control-lg"
                                   placeholder="Ingrese su usuario"
                                   required autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="fas fa-key"></i> Password
                            </label>
                            <input type="password" id="password" name="password"
                                   class="form-control form-control-lg"
                                   placeholder="Ingrese su contraseña"
                                   required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Sign in
                            </button>
                        </div>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    </form>

                    <hr class="my-4">

                    <div class="text-center text-muted">
                        <small>
                            <strong>Usuarios de prueba:</strong><br>
                            Usuario: <code>user</code> / Admin: <code>admin</code><br>
                            Password: <code>12345</code>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
