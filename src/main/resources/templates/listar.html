<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/layout :: head}"></head>
<body>

<header th:replace="~{layout/layout :: header}"></header>

<div class="container my-5">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h2 class="mb-0">
                <i class="fas fa-list"></i> <span th:text="${titulo}"></span>
            </h2>
        </div>
        <div class="card-body">

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="mb-3" sec:authorize="hasRole('ROLE_ADMIN')">
                <a th:href="@{/form}" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> crear curso
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>CODIGO</th>
                        <th>NOMBRES</th>
                        <th>CREDITOS</th>
                        <th sec:authorize="hasRole('ROLE_ADMIN')">EDITAR</th>
                        <th sec:authorize="hasRole('ROLE_ADMIN')">ELIMINAR</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="curso : ${cursos}">
                        <td th:text="${curso.id}"></td>
                        <td th:text="${curso.nombre}"></td>
                        <td th:text="${curso.creditos}"></td>
                        <td sec:authorize="hasRole('ROLE_ADMIN')">
                            <a th:href="@{/form/} + ${curso.id}" class="btn btn-primary btn-sm">
                                <i class="fas fa-edit"></i> editar
                            </a>
                        </td>
                        <td sec:authorize="hasRole('ROLE_ADMIN')">
                            <a th:href="@{/eliminar/} + ${curso.id}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Está seguro que desea eliminar?')">
                                <i class="fas fa-trash"></i> eliminar
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(cursos)}" class="alert alert-info text-center">
                <i class="fas fa-info-circle"></i> No hay cursos registrados en la base de datos
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
