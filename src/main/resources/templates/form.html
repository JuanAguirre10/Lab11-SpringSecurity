<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

<header th:replace="~{layout/layout :: header}"></header>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h2 class="mb-0">
                        <i class="fas fa-edit"></i> <span th:text="${titulo}"></span>
                    </h2>
                </div>
                <div class="card-body">

                    <form th:action="@{/form}" th:object="${curso}" method="post">

                        <div class="mb-4">
                            <label for="nombre" class="form-label">
                                <i class="fas fa-book"></i> Nombre del Curso
                            </label>
                            <input type="text"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   id="nombre"
                                   placeholder="Ej: Desarrollo de Aplicaciones Web">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="creditos" class="form-label">
                                <i class="fas fa-award"></i> Créditos
                            </label>
                            <input type="number"
                                   th:field="*{creditos}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   id="creditos"
                                   placeholder="Ej: 5"
                                   min="1">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('creditos')}"
                                 th:errors="*{creditos}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                            <a th:href="@{/listar}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                        </div>

                        <input type="hidden" th:field="*{id}">
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
